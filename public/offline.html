<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're offline — DHIIL</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7faf9;
    color: #0f1a17;
  }
  .card { max-width: 360px; text-align: center; }
  .badge {
    width: 56px; height: 56px; border-radius: 16px;
    background: #0e8760; color: #fff; display: flex;
    align-items: center; justify-content: center;
    font-weight: 800; font-size: 24px; margin: 0 auto 16px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #5b6b66; margin: 0 0 20px; }
  button {
    appearance: none; border: none; border-radius: 12px;
    background: #0e8760; color: #fff; font-weight: 600;
    font-size: 14px; padding: 12px 20px; min-height: 44px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">D</div>
    <h1 data-so="Internet Ma Haysatid" data-en="You're offline">Internet Ma Haysatid</h1>
    <p data-so="DHIIL ma gaarin karin shabakadda. Boggaga hore la soo booqday ayaa laga yaabaa inay wali diyaar yihiin — hubi xiriirkaaga oo isku day mar kale." data-en="DHIIL couldn't reach the network. Some previously visited pages may still be available — check your connection and try again.">
      DHIIL ma gaarin karin shabakadda. Boggaga hore la soo booqday ayaa laga yaabaa inay wali diyaar yihiin — hubi xiriirkaaga oo isku day mar kale.
    </p>
    <button onclick="location.reload()" data-so="Isku Day Mar Kale" data-en="Retry">Isku Day Mar Kale</button>
  </div>
  <script>
    // Best-effort: match whichever language the app was last set to
    // (mirrors the dhiil_lang cookie/localStorage key used by the app),
    // so the offline page doesn't jar the user with a different language.
    (function () {
      try {
        var lang =
          localStorage.getItem("dhiil_lang") ||
          (document.cookie.match(/(?:^|; )dhiil_lang=([^;]+)/) || [])[1] ||
          "so";
        if (lang !== "so" && lang !== "en") lang = "so";
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-" + lang + "]").forEach(function (el) {
          el.textContent = el.getAttribute("data-" + lang);
        });
      } catch (e) {
        // localStorage/cookies unavailable — Somali default text stays as-is.
      }
    })();
  </script>
</body>
</html>
